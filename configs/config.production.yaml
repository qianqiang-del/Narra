app:
  name: Narra
  version: prod
  mode: release
  port: 8080
database:
  postgres:
    host: localhost
    port: 5432
    username: narra
    password: ""
    database: narra
    sslmode: disable
    max_idle_conns: 3
    max_open_conns: 15
  redis:
    host: localhost
    port: 6379
    password: ""
    db: 0
    pool_size: 8
jwt:
  secret: ""
sms:
  enabled: true
  api: dypnsapi
  region_id: cn-hangzhou
  sign_name: "恒创联众"
  template_code: "100001"
  template_param: '{"code":"##code##","min":"5"}'
  scheme_name: "1"
  country_code: "86"
  code_length: 6
  valid_time: 300
  duplicate_policy: 1
  interval: 60
  code_type: 1
  case_auth_policy: 1
embedding:
  enabled: true
  base_url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen3-Embedding-0.6B
  timeout: 120s
  dimensions: 1024
rerank:
  enabled: true
  base_url: https://api.siliconflow.cn/v1
  model: BAAI/bge-reranker-v2-m3
  timeout: 120s
vlm:
  enabled: true
  base_url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen3.5-35B-A3B
  timeout: 120s
default_llm:
  enabled: true
  name: "平台默认模型"
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  timeout: 120s
tts:
  enabled: true
  provider: qwen
  base_url: https://dashscope.aliyuncs.com/api/v1
  model: qwen3-tts-flash
  timeout: 60s
document_parser:
  enabled: true
  python_path: /usr/local/bin/python3
  pdf_table_mode: pymupdf

knowledge_ingest:
  parse_concurrency: 1
storage:
  upload_dir: data/uploads
  audio_dir: data/audio
  knowledge_dir: data/knowledge
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket: narra-agent
    timeout: 30s
langfuse:
  enabled: false
  host: https://us.cloud.langfuse.com
log:
  level: info
worker:
  concurrency: 5
  max_retry: 2
  timeout: 30m
  reconcile_interval: 10m
classroom:
  page_concurrency: 10
  tts_pool_size: 3
  max_duration: 25m
