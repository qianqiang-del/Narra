app:
  name: narra-api                                  # 应用名称
  version: 1.0.0                                   # 应用版本
  mode: debug                                      # 运行模式：debug、release 或 test
  port: 8080                                       # HTTP 服务端口

database:
  postgres:
    host: localhost                                # PostgreSQL 主机地址
    port: 5432                                     # PostgreSQL 端口
    username: postgres                             # 数据库用户名
    password: password                             # 数据库密码
    database: narra                                # 数据库名称
    max_idle_conns: 10                             # 最大空闲连接数
    max_open_conns: 100                            # 最大打开连接数
  redis:
    host: localhost                                # Redis 主机地址
    port: 6379                                     # Redis 端口
    password: ""                                   # Redis 密码
    db: 0                                          # Redis 数据库编号
    pool_size: 10                                  # Redis 连接池大小

jwt:
  secret: your-jwt-secret-key-change-in-production # JWT 签名密钥，生产环境必须替换
  expire_hours: 24h                                # JWT 有效期

log:
  level: debug                                     # 日志级别
  filename: logs/app.log                           # 日志文件路径
  max_size: 100                                    # 单个日志文件最大大小，单位 MB
  max_backups: 3                                   # 保留的旧日志文件数量
  max_age: 28                                      # 日志文件最大保留天数
  compress: true                                   # 是否压缩旧日志文件

cors:
  enabled: true                                    # 是否启用跨域请求支持
  allow_origins:
    - http://localhost:3000
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
  expose_headers: []
  allow_credentials: true                          # 是否允许携带凭证
  max_age: 86400                                   # 预检请求缓存时间，单位秒
