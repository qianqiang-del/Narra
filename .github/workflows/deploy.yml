name: Deploy Narra

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: narra-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/qianqiang-del/narra-api:${{ github.sha }}
          cache-from: type=gha,scope=narra-api
          cache-to: type=gha,scope=narra-api,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: tar -czf web.tar.gz -C frontend/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: narra-web
          path: web.tar.gz
          retention-days: 1

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: narra-web
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy release files
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'mkdir -p /opt/narra/deploy /opt/narra/data /opt/narra/web/incoming /opt/narra/web/releases'
          scp -o StrictHostKeyChecking=yes deploy/compose.app.yml deploy/nginx.conf deploy/release.sh \
            "$SSH_USER@$SSH_HOST:/opt/narra/deploy/"
          scp -o StrictHostKeyChecking=yes web.tar.gz \
            "$SSH_USER@$SSH_HOST:/opt/narra/web/incoming/$GITHUB_SHA.tar.gz"
      - name: Deploy and verify
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash /opt/narra/deploy/release.sh $GITHUB_SHA ghcr.io/qianqiang-del/narra-api:$GITHUB_SHA $GITHUB_ACTOR"
