<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Narra favicon">
  <title>Narra 标志（小尺寸简化版）</title>
  <desc>为 favicon 制作：外围节点由 5 个减为 3 个并放大，圆环加粗，中心点加大，保证 16px 下不糊、不误读。</desc>
  <style>
    .ring { stroke: #46639c; }
    .node { fill: #46639c; }
    .core { fill: #c3a05c; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #93a9cf; }
      .node { fill: #93a9cf; }
      .core { fill: #d4b678; }
    }
  </style>

  <circle class="ring" cx="32" cy="32" r="20" fill="none" stroke-width="5.5"/>

  <circle class="node" cx="32"    cy="12"    r="6"/>
  <circle class="node" cx="49.32" cy="41"    r="6"/>
  <circle class="node" cx="14.68" cy="41"    r="6"/>

  <circle class="core" cx="32" cy="32" r="7.5"/>
</svg>
