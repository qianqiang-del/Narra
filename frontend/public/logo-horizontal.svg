<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" width="236" height="64" role="img" aria-label="Narra logo with wordmark">
  <title>Narra 标志（含字标版）</title>
  <desc>图形部分与 logo-mark.svg 一致，右侧为 Narra 字标，采用与站点标题一致的衬线字体。</desc>
  <style>
    .ring { stroke: #46639c; }
    .node { fill: #46639c; }
    .core { fill: #c3a05c; }
    .word { fill: #2b3340; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #93a9cf; }
      .node { fill: #93a9cf; }
      .core { fill: #d4b678; }
      .word { fill: #e8ecf5; }
    }
  </style>

  <g transform="translate(0,0)">
    <circle class="ring" cx="32" cy="32" r="20" fill="none" stroke-width="2.5"/>
    <circle class="node" cx="32"    cy="12"    r="3.4"/>
    <circle class="node" cx="51.02" cy="25.82" r="3.4"/>
    <circle class="node" cx="43.76" cy="48.18" r="3.4"/>
    <circle class="node" cx="20.24" cy="48.18" r="3.4"/>
    <circle class="node" cx="12.98" cy="25.82" r="3.4"/>
    <circle class="core" cx="32" cy="32" r="6.2"/>
  </g>

  <!-- 字标：与 evenstar 同族的衬线体；如需跨设备字形完全一致，请在此处转曲后交付 -->
  <text class="word" x="76" y="40"
        font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif SC', serif"
        font-size="27" letter-spacing="1.2">Narra</text>
</svg>
