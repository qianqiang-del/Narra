name: narra-data
services:
  postgres:
    image: ghcr.io/qianqiang-del/narra-postgres:pg17
    container_name: narra-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:?POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DATABASE:-narra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DATA_BIND_IP:?DATA_BIND_IP is required}:5432:5432"
    shm_size: 256m
    mem_limit: 1100m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  redis:
    image: ghcr.io/qianqiang-del/narra-redis:7-alpine
    container_name: narra-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "${DATA_BIND_IP}:6379:6379"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  pgdata:
  redisdata:
