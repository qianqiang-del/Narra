name: narra-app
services:
  api:
    image: ${IMAGE:?IMAGE is required}
    container_name: narra-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:?POSTGRES_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-narra}
      POSTGRES_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      APP_MODE: release
      APP_PORT: "8080"
      LOG_LEVEL: info
      NARRA_DEFAULT_LLM_API_KEY: ${NARRA_DEFAULT_LLM_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      DOCUMENT_PARSER_OCR_API_KEY: ${DOCUMENT_PARSER_OCR_API_KEY:-}
      MCP_SEARCH_API_KEY: ${MCP_SEARCH_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      TZ: Asia/Shanghai
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - /opt/narra/data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1280m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
